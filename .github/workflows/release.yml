# Release from a build branch.
#
# Creating (or pushing to) a branch named build-v<version>, for example
# build-v1.1.0-beta.1, builds Lanyard <version> for Windows, macOS and Linux and
# publishes it as the GitHub release v<version>. Versions with a suffix
# (1.1.0-beta.1, 2.0.0-rc.1) are marked as prereleases.
#
# Pushing to the branch again rebuilds the same version: the tag moves to the
# new commit and the release files are replaced.

name: Release

on:
  push:
    branches: ['build-v*']
  workflow_dispatch: # run it on a build-v* branch from the Actions tab

concurrency:
  group: release-${{ github.ref }}
  # Never stop a run halfway through publishing; a newer push waits its turn.
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24
  npm_config_fund: false
  npm_config_update_notifier: false

jobs:
  version:
    name: Version from branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      numeric: ${{ steps.parse.outputs.numeric }}
    steps:
      - id: parse
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          version="${BRANCH#build-v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ "$BRANCH" != build-v* || ! "$version" =~ $semver ]]; then
            echo "::error::Branch '$BRANCH' must be named build-v<version>, e.g. build-v1.2.0 or build-v1.2.0-beta.1"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
            echo "numeric=${version%%-*}.0" # Windows file versions: 1.2.0-beta.1 -> 1.2.0.0
          } >> "$GITHUB_OUTPUT"
          echo "### Lanyard $version (tag v$version, prerelease: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.name }})
    needs: [version, ci]
    runs-on: ${{ matrix.os }}
    # Windows signing can wait for an approval in SignPath.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            exe: release/win-unpacked/Lanyard.exe
            asar: release/win-unpacked/resources/app.asar
            files: release/*.exe
          - name: macos # builds both arm64 and x64; the runner can launch the arm64 one
            os: macos-latest
            exe: release/mac-arm64/Lanyard.app/Contents/MacOS/Lanyard
            asar: release/mac-arm64/Lanyard.app/Contents/Resources/app.asar
            files: release/*.dmg
          - name: linux
            os: ubuntu-latest
            exe: release/linux-unpacked/lanyard
            asar: release/linux-unpacked/resources/app.asar
            files: release/*.AppImage
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Windows builds are code-signed through SignPath once the repository
      # variable SIGNPATH_ORGANIZATION_ID is set (CONTRIBUTING.md -> Code signing).
      SIGN_WINDOWS: ${{ matrix.name == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Set the app version to ${{ env.VERSION }}
        run: npm version "${{ env.VERSION }}" --no-git-tag-version --allow-same-version
      - run: npm run build

      - name: Build installers
        if: matrix.name != 'windows'
        run: npx electron-builder --publish never

      # Windows is built in two steps so both the app and its installer can be
      # signed: SignPath signs files from GitHub Actions artifacts and can't
      # sign inside an NSIS installer.
      - name: Build the Windows app
        if: matrix.name == 'windows'
        run: npx electron-builder --win --dir --publish never
      - name: Upload the unsigned app for signing
        id: unsigned-app
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-app-unsigned
          path: release/win-unpacked
          retention-days: 1
      - name: Sign the app (SignPath)
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          connector-url: https://pipelineconnector.connectors.signpath.io/GitHub/GitHubCom
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'lanyard' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          # Lanyard.exe carries a numeric product version: 1.2.0-beta.1 -> 1.2.0.0
          parameters: |
            productVersion: "${{ needs.version.outputs.numeric }}"
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/win-signed
      - name: Use the signed app
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: |
          rm -rf release/win-unpacked
          mv release/win-signed release/win-unpacked
      - name: Build the Windows installer
        if: matrix.name == 'windows'
        run: npx electron-builder --win nsis --prepackaged release/win-unpacked --publish never
      - name: Upload the unsigned installer for signing
        id: unsigned-installer
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-unsigned
          path: release/*.exe
          retention-days: 1
      - name: Sign the installer (SignPath)
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          connector-url: https://pipelineconnector.connectors.signpath.io/GitHub/GitHubCom
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'lanyard' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          parameters: |
            version: "${{ env.VERSION }}"
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/installer-signed
      - name: Use the signed installer and check the signatures
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          Move-Item -Force release/installer-signed/*.exe release/
          foreach ($file in @('release/win-unpacked/Lanyard.exe') + (Get-ChildItem release/*.exe).FullName) {
            $sig = Get-AuthenticodeSignature $file
            "{0}: {1} ({2})" -f $file, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne 'Valid') { throw "$file is not validly signed" }
          }
      # The installed lanyard command runs the app binary in Node mode on the
      # CLI inside app.asar; check that works with the fuses set, and that the
      # packaged app reports the release version.
      - name: Smoke-test the packaged CLI
        shell: bash
        env:
          APP_EXE: ${{ matrix.exe }}
          APP_ASAR: ${{ matrix.asar }}
        run: |
          reported=$(LANYARD_SSH_DIR="$RUNNER_TEMP/ssh" LANYARD_HOME="$RUNNER_TEMP/home" ELECTRON_RUN_AS_NODE=1 \
            "$APP_EXE" "$APP_ASAR/bin/lanyard.js" --version)
          echo "packaged CLI reports $reported"
          [[ "$reported" == "$VERSION" ]] || { echo "::error::expected version $VERSION, got $reported"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: lanyard-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  npm-package:
    name: npm package
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      # prepack builds the CLI; the tarball is what `npm publish` would upload.
      - run: npm pack
      - name: Smoke-test the packed CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/try" "./lanyard-ssh-$VERSION.tgz"
          reported=$(LANYARD_SSH_DIR="$RUNNER_TEMP/ssh" LANYARD_HOME="$RUNNER_TEMP/home" \
            "$RUNNER_TEMP/try/node_modules/.bin/lanyard" --version)
          [[ "$reported" == "$VERSION" ]] || { echo "::error::expected version $VERSION, got $reported"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: lanyard-npm
          path: lanyard-ssh-*.tgz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [version, package, npm-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
      actions: write # rebuild the website so its download links follow
      id-token: write # sign the build attestations (Sigstore)
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      WINDOWS_SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lanyard-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # One detached signature over the checksums covers every file. Skipped
      # until the GPG_PRIVATE_KEY secret exists (CONTRIBUTING.md -> Code signing).
      - name: Sign the checksums (GPG)
        working-directory: dist
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "No GPG_PRIVATE_KEY secret; checksums are not signed."
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign --output SHA256SUMS.txt.asc SHA256SUMS.txt
          gpg --batch --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          rm -rf "$GNUPGHOME"
      # A Sigstore-signed statement for every file that it was built from this
      # commit by this workflow. Check one with `gh attestation verify`.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.tgz
            dist/SHA256SUMS.txt
      - name: Release notes
        working-directory: dist
        run: |
          # One row per file this run built, so the table always matches the assets.
          row() { for f in $2; do if [[ -e "$f" ]]; then echo "| $1 | \`$f\` |"; fi; done; }
          {
            echo "## Install"
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            row "Windows" "*.exe"
            row "macOS (Apple Silicon)" "*arm64.dmg"
            row "macOS (Intel)" "*x64.dmg"
            row "Linux (\`chmod +x\`, then run it)" "*.AppImage"
            row "CLI only, Node.js 20+ (\`npm install -g <file>\`)" "*.tgz"
            echo
            if [[ "$WINDOWS_SIGNED" == true ]]; then
              echo "The Windows app and installer are code-signed (free code signing provided by"
              echo "[SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org))."
              echo "Until the certificate builds up reputation, SmartScreen may still ask you to confirm (More info, then Run anyway)."
            else
              echo "The Windows build is not code-signed yet. SmartScreen may ask you to confirm (More info, then Run anyway)."
            fi
            echo "The macOS build is not notarized: right-click the app and choose Open the first time,"
            echo "or run \`xattr -dr com.apple.quarantine /Applications/Lanyard.app\`."
            echo
            echo "## Verify"
            echo
            echo "Every file has a signed build attestation proving it was built from this repository by its release workflow:"
            echo
            echo '```bash'
            echo "gh attestation verify <file> --repo $GH_REPO"
            echo '```'
            echo
            echo "\`SHA256SUMS.txt\` lists the checksum of every file. See the"
            echo "[code signing policy](https://github.com/$GH_REPO/blob/main/SECURITY.md#code-signing-policy)."
            if [[ -e SHA256SUMS.txt.asc ]]; then
              echo "It is GPG-signed (\`SHA256SUMS.txt.asc\`); the public key is in [\`KEYS\`](https://github.com/$GH_REPO/blob/main/KEYS):"
              echo
              echo '```bash'
              echo "gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt && sha256sum --check --ignore-missing SHA256SUMS.txt"
              echo '```'
            fi
            echo
            # GitHub's changelog since the previous release.
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body
          } > ../notes.md
          cat ../notes.md
      - name: Create or update the release
        working-directory: dist
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Rebuild of an existing version: move the tag to this commit and
            # replace the release files, dropping any that this build didn't make.
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              [[ -e "$name" ]] || gh release delete-asset "$TAG" "$name" --yes
            done
            gh release upload "$TAG" --clobber ./*
            gh release edit "$TAG" --title "Lanyard $VERSION" --notes-file ../notes.md --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" ./* --target "$GITHUB_SHA" --title "Lanyard $VERSION" \
              --notes-file ../notes.md --prerelease="$PRERELEASE"
          fi
          echo "Published https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
      # Releases made with this workflow's token don't trigger other workflows,
      # so start the website build explicitly. Its download buttons also refresh
      # themselves in the browser, so a failure here only delays the baked links.
      - name: Rebuild the website
        continue-on-error: true
        run: gh workflow run pages.yml --ref main

  npm-publish:
    name: Publish to npm
    # Off until npm publishing is set up (CONTRIBUTING.md -> Releases), then
    # turned on with the repository variable NPM_PUBLISH=true.
    if: vars.NPM_PUBLISH == 'true'
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: lanyard-npm
          path: npm
      - name: Publish lanyard-ssh@${{ needs.version.outputs.version }}
        env:
          # Empty when npm trusted publishing is used instead of a token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # npm never allows publishing the same version twice, so a rebuild
          # of an existing release leaves the registry alone.
          if npm view "lanyard-ssh@$VERSION" version > /dev/null 2>&1; then
            echo "lanyard-ssh@$VERSION is already on npm; nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Stable versions become `latest`. Prereleases get a tag named after
          # their label (1.2.0-beta.1 -> beta, 2.0.0-rc.1 -> rc), so a plain
          # `npm install -g lanyard-ssh` keeps installing the stable release.
          tag=latest
          if [[ "$PRERELEASE" == true ]]; then
            tag="${VERSION#*-}"
            tag="${tag%%.*}"
            if [[ ! "$tag" =~ ^[A-Za-z][A-Za-z0-9-]*$ ]]; then tag=next; fi
          fi
          npm publish "npm/lanyard-ssh-$VERSION.tgz" --access public --tag "$tag" --provenance
          # While only prereleases exist there is no `latest`, and a plain
          # `npm install lanyard-ssh` would fail; point it at this version.
          if [[ "$tag" != latest && -z "$(npm view lanyard-ssh dist-tags.latest 2> /dev/null)" ]]; then
            npm dist-tag add "lanyard-ssh@$VERSION" latest ||
              echo "::warning::No latest tag on npm; run: npm dist-tag add lanyard-ssh@$VERSION latest"
          fi
          {
            echo "Published [lanyard-ssh@$VERSION](https://www.npmjs.com/package/lanyard-ssh/v/$VERSION) to npm with the \`$tag\` tag."
            echo
            echo "    npm install -g lanyard-ssh@$tag"
          } >> "$GITHUB_STEP_SUMMARY"
